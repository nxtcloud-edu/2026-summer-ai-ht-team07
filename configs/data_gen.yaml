# =============================================================================
# YEDA 합성 데이터 생성 파라미터
# =============================================================================
# 소유자: A(공정물리). C(데이터·모델)는 이 파일을 읽기만 하고 고치지 않는다.
#
# 이 파일이 곧 "우리가 어떤 물리를 가정했는가"의 명세다. 발표 Q&A에서 이 파일을
# 그대로 띄울 수 있어야 한다. 각 계수의 근거는 docs/PHYSICS_RATIONALE.md 참조.
#
# ⚠ 여기 있는 어떤 숫자도 최적화 가이드의 정답으로 재사용하지 않는다.
#    가이드는 학습된 모델에서만 유도된다. (tests/test_contracts.py 가 검사)
# =============================================================================

seed: 20260810          # 재현성. 바꾸면 데이터가 바뀌므로 팀 합의 후에만 변경.
n_samples: 8000         # 홀드아웃 분리 후에도 학습에 충분한 규모
output_path: data/raw/yeda_synthetic.csv

# -----------------------------------------------------------------------------
# 1. 공정 조건 샘플링
# -----------------------------------------------------------------------------
# 실제 양산 데이터는 균등분포가 아니다. 레시피 설정점 주변에 몰려 있고,
# 가끔 조건 탐색(DOE) 로트가 범위 전체를 훑는다. 그 구조를 그대로 흉내낸다.
#   - recipe_ratio 만큼: 설정점 중심 절단정규분포 (일상 양산)
#   - 나머지: 허용 범위 균등분포 (조건 탐색 로트)
# 균등 성분이 없으면 모델이 범위 가장자리를 전혀 못 배워 최적화 제안이 위험해진다.
sampling:
  recipe_ratio: 0.65
  # 설정점: 현직자 면담 기준 "보통 이렇게 놓고 돌린다" 값
  setpoints:
    uv_time: 4.8
    uv_intensity: 1180
    pin_speed: 1.10
    pin_pressure: 29.0
    pin_height: 0.48
    head_vacuum: -65.5
    pin_vacuum: -50.0
    temperature: 24.0
    humidity: 44.0
    vacuum_status: -95.5
    runtime_hours: 9.0
    die_thickness: 128.0
  # 양산 산포(표준편차). 허용 범위 폭 대비 약 8~12% 수준.
  spread_ratio: 0.10
  # 범주형: UV 경화형 테이프(1) 채택 비율
  tape_type_p1: 0.55

# -----------------------------------------------------------------------------
# 2. 변수별 잠재 점수 기여
# -----------------------------------------------------------------------------
# weight 는 부호 있는 값: 양수 = 값이 커질수록 픽업 성공 확률 상승.
# shape=peak 일 때 weight 는 최적점 이탈 페널티 크기(양수).
# shape: linear | sat | peak   (자세한 정의는 src/yeda/data/physics.py)
#
# ⚠ 단조 제약(schema.MONOTONE_CONSTRAINTS)과 부호가 어긋나면 모델 성능이 망가진다.
#    변경 시 tests/test_generator.py::test_monotonicity_matches_schema 를 돌릴 것.
contributions:
  uv_time:
    shape: sat
    sharpness: 0.9
    weight: 1.00      # 점착제 경화 → 이형 용이. 가장 큰 단일 기여.
  uv_intensity:
    shape: sat
    sharpness: 0.8
    weight: 0.30      # uv_time 과 동일 메커니즘, 설비 편차 범위가 좁아 기여 작음.
  pin_speed:
    shape: linear
    weight: -0.75     # 빠를수록 굽힘 응력 ↑ → 크랙. (die_thickness 와 상호작용)
  pin_pressure:
    shape: sat
    sharpness: 1.1
    weight: 0.90      # 박리 구동력. 크면 좋으나 포화.
  pin_height:
    shape: peak
    optimum: 0.50     # mm. 낮으면 박리 미개시, 높으면 과굽힘 파손.
    weight: 1.80      # 페널티 크기. 선형 모델이 못 잡는 비단조 항 — 트리 앙상블 필요 근거.
  head_vacuum:
    shape: sat
    sharpness: 1.0
    weight: -0.75     # 값이 클수록(=진공 약할수록) 흡착 실패. 부호 규약 주의.
  pin_vacuum:
    shape: sat
    sharpness: 1.0
    weight: -0.55     # 테이프 하부 고정력. 위와 동일한 부호 규약.
  temperature:
    shape: peak
    optimum: 24.0     # degC. 점착제 점탄성의 공정 윈도우 중심.
    weight: 1.30      # 위와 동일하게 비단조. 공정 윈도우가 좁다는 현장 증언 반영.
  humidity:
    shape: linear
    weight: -0.40     # 계면 수분 → 미세 슬립.
  vacuum_status:
    shape: sat
    sharpness: 0.9
    weight: -0.35     # 공용 진공 라인 건전성. 설비 상태 지표(조정 불가).
  runtime_hours:
    shape: linear
    weight: -0.55     # 콜릿 마모 대리 지표. 교체 전까지 단조 악화.
  tape_type:
    shape: linear
    weight: -0.20     # UV 테이프(1)는 초기 점착력이 높아 UV 없이는 오히려 불리.
  die_thickness:
    shape: linear     # 상호작용과의 부호 충돌을 피하려 linear 유지 (physics.py 주석 참조)
    weight: 0.75      # 두꺼울수록 굽힘 강성 ↑ → 크랙 저항.

# -----------------------------------------------------------------------------
# 3. 상호작용항 (선형 모델로는 못 잡는 구조 — 트리 앙상블이 필요한 이유)
# -----------------------------------------------------------------------------
interactions:
  pin_speed_x_die_thickness: 0.55    # 얇은 다이 x 빠른 핀 = 크랙 (부호 교차형)
  uv_time_x_tape_type: 0.75          # UV 경화형 테이프에서만 UV 효과 증폭
  runtime_hours_x_head_vacuum: 1.00  # 마모 x 약한 진공 = 복합 악화 (AND형)

# -----------------------------------------------------------------------------
# 4. 잠재 점수 → 확률
# -----------------------------------------------------------------------------
# p = sigmoid(intercept + scale * sum(contributions + interactions))
# y ~ Bernoulli(p)  ← 결정론적 규칙이 아니라 확률적 라벨. 같은 조건도 결과가 갈린다.
#
# scale 을 키우면 라벨이 결정론에 가까워져 정확도가 99%대로 올라간다(= 실패).
# intercept 는 전체 성공률을 목표 대역으로 맞춘다.
# 두 값은 scripts/calibrate_generator.py 로 재보정한다. 감으로 고치지 말 것.
latent:
  scale: 3.00
  intercept: 2.40

# 검수 기준 — 생성 후 자동 검증되며, 벗어나면 make data 가 경고한다.
targets:
  success_rate: [0.65, 0.80]     # 클래스 균형
  bayes_accuracy: [0.82, 0.90]   # 도달 가능한 이론 상한. 0.95↑ 면 생성기가 잘못된 것.

# -----------------------------------------------------------------------------
# 5. 계측 현실성
# -----------------------------------------------------------------------------
# 라벨은 '참값' 조건으로 생성한 뒤, 기록되는 값에는 센서 노이즈를 입힌다.
# → 모델은 노이즈가 낀 관측만 보므로 환원 불가능한 오차가 자연스럽게 생긴다.
# → 동시에 소수점 9자리가 남지 않아 합성 데이터 티가 덜 난다.
noise:
  # 센서 노이즈 표준편차 = 해당 변수 분해능(schema.resolution) x 이 배수
  sensor_sigma_in_resolution: 0.8
  round_to_resolution: true

# 결측치: 전처리 로직이 필요한 상태를 의도적으로 만든다.
# runtime_hours 는 설비 로그 유실이 잦아 결측률을 높게 잡았다(현직자 면담 반영).
missing:
  default_rate: 0.015
  per_feature:
    runtime_hours: 0.030
    humidity: 0.025
    vacuum_status: 0.020
  # 타겟과 die_id 에는 결측을 넣지 않는다.
