# =============================================================================
# YEDA 최적화(개선 가이드) 설정
# =============================================================================
# 소유자: D(설명·최적화).
#
# ⚠ 이 파일에는 configs/data_gen.yaml 의 어떤 계수도 복사해 오지 않는다.
#    탐색 범위는 schema.py 의 물리적 허용 범위에서만 온다.
#    생성 규칙의 임계값을 정답으로 재사용하면 "정답 넣고 정답 꺼내기"가 된다.
# =============================================================================

# 탐색 전략: local(좌표 하강) | random(랜덤 서치) | optuna(TPE)
# 기본은 local — 데모에서 1초 안에 끝나고 결과가 결정론적이라 리허설이 안정적이다.
# optuna 는 시간이 남으면 켠다(M5 이후). 없으면 자동으로 random 으로 폴백한다.
strategy: local

# 최적화가 건드릴 수 있는 변수.
# schema.ADJUSTABLE 이 기본이며, 여기서 더 좁힐 수만 있고 넓힐 수는 없다.
# die_thickness(제품 사양), tape_type(자재), runtime_hours(설비 상태),
# vacuum_status(설비 상태)는 schema 단계에서 이미 제외되어 있다.
tunable_override: null   # null 이면 schema.ADJUSTABLE 그대로 사용

# 현장 수용성 제약: 한 번에 너무 많이 바꾸라고 하면 실무자가 안 받아들인다.
constraints:
  # 각 변수를 현재값 대비 최대 몇 %까지 움직일 수 있는지 (허용 범위 폭 기준)
  # 0.18 로 조인 이유: 넉넉하게 두면(0.35) 모델이 확률을 99%대로 밀어올려 제안이
  # 과장돼 보인다. "조건 몇 개 만지니 99% 됩니다"는 심사위원이 가장 먼저 의심하는 말이다.
  # 좁게 두면 회복 폭이 현실적으로 나오고, 고정 변수 때문에 회복에 한계가 있다는 점도 드러난다.
  max_relative_move: 0.18
  # 동시에 바꾸라고 제안할 변수 개수 상한. 3개를 넘으면 원인 귀속이 불가능해진다.
  max_changed_features: 3
  # 이보다 작은 개선은 제안하지 않는다 (%p). 노이즈 수준의 제안은 신뢰를 깎는다.
  min_gain_pp: 0.5

# 탐색 파라미터
search:
  local:
    # 좌표 하강: 변수별로 그리드를 훑고 가장 좋은 값을 채택, 여러 번 반복
    grid_points: 21     # 변수당 후보 개수 (분해능으로 스냅됨)
    rounds: 3           # 전체 변수를 몇 번 반복할지
  random:
    n_trials: 400
  optuna:
    n_trials: 200
    timeout_seconds: 20

# 결과 표시
report:
  # 개선 가이드 상위 몇 줄을 UI에 띄울지
  top_n: 5
  output_csv: artifacts/metrics/optimization_example.csv
